---
##
- name: Update the system package 
  ansible.builtin.yum: 
    name: Update the machine 
    state: latest
    register: Update_Output

- name: Print the update_Output
  ansible.builtin.debug:
    msg: "{{Update_Output}}"
    
- name: Install required package (wget curl tar)
  ansible.builtin.yum:
    name: 
      - wget 
      - tar 
      - curl
    state: present

- name: Download Yugabyte tarball
  ansible.builtin.get_url: 
    url: https://downloads.yugabyte.com/releases/2.25.0.0/yugabyte-2.25.0.0-b489-linux-x86_64.tar.gz
    dest: /tmp/yugabyte-2.25.0.0-b489-linux-x86_64.tar.gz

- name: Extract Yugabyte tarball 
  unarchive: 
    src: /tmp/yugabyte-2.25.0.0-b489-linux-x86_64.tar.gz
    dest: /home/packer
    remote_src: yes 
  
- name: Change to YugabyteDB Directory 
  ansible.builtin.command: chdir=/home/packer/yugabyte-2.25.0.0/ pwd
  register: yugabyte_directory
  ignore_errors: true

- name: Run yugabyteDB post_installation script
  ansible.builtin.command: ./bin/post_install.sh 
  args:
    chdir: /home/packer/yugabyte-2.25.0.0/

- name: Change ownership of YugabyteDB files
  ansible.builtin.file: 
    path: /home/packer/yugabyte-2.25.0.0/
    owner: packer 
    group: packer 
    recurse: yes 

- name: Start the YugabyteDB 
  ansible.builtin.command: ./bin/yugabyted start 
  args: 
    chdir: /home/packer/yugabyte-2.25.0.0/
  
- name: Check YugabyteDB Status 
  ansible.builtin.command: ./bin/yugabyted status 
  args:
    chdir: /home/packer/yugabyte-2.25.0.0/
  register: yugabyte_status
  failed_when: "'Setup failed' in yugabyte_status.stderr"
  ignore_errors: true

- name: Output success message 
  ansible.builtin.debug: 
    msg: "Yugabyte setup completed successfully !"

- name: Calulate and Display execution time 
  ansible.builtin.debug: 
    msg: "Total execution time: {{ ansible_date_time.iso8601 }} seconds"




