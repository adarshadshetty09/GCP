---
   - name: Install openssh-server
     package:
       name: openssh-server
       state: present
    #become: true

   - name: Installation required Packages
     package:
       name:
         - wget
         - openssl
       state: present

   - name: create a directory
     file:
        path: /usr/lib/sftp-server
        state: directory

   - name: Create symlink for sftp-server if missing
     file:
        src: /usr/libexec/openssh/sftp-server
        dest: /usr/lib/sftp-server
        state: link
        force: true
     when: ansible_facts['os_family'] == "CentOS"

   - name: Download tar
     get_url:
       url: "{{ yb_file_url }}"
       dest: "/tmp/{{ yb_tar_file }}"

   - name: Extract Yugabyte archive
     unarchive:
       src: "/tmp/{{ yb_tar_file }}"
       dest: "/home/centos"
       remote_src: yes
       owner: "{{ yb_user }}"
       group: "{{ yb_user }}"

   - name: remove tar file
     file:
       path: "/tmp/{{ yb_tar_file }}"
       state: absent

   - name: change directory
     command: "./bin/post_install.sh"
     args:
       chdir: "{{ yb_dir }}"

   - name: Change ownership
     file:
       path: "{{ yb_dir }}"
       owner: "{{ yb_user }}"
       group: "{{ yb_user }}"
       mode: "0755"