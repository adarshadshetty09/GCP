---
## Update the system package
- name: Update the system package
  ansible.builtin.yum:
    name: "*"
    state: latest
  register: Update_Output

- name: Print the update_Output
  ansible.builtin.debug:
    msg: "{{ Update_Output }}"

- name: Install required package (wget, curl, tar)
  ansible.builtin.yum:
    name:
      - wget
      - tar
      - curl
    state: present
    update_cache: yes
  register: Installation_output

- name: Print the Installation_output
  ansible.builtin.debug:
    msg: "{{ Installation_output }}"

- name: Download Yugabyte tarball
  ansible.builtin.get_url: 
    url: https://downloads.yugabyte.com/releases/2.25.0.0/yugabyte-2.25.0.0-b489-linux-x86_64.tar.gz
    dest: /tmp/yugabyte-2.25.0.0-b489-linux-x86_64.tar.gz
  register: download_output

- name: Extract Yugabyte tarball
  unarchive: 
    src: /tmp/yugabyte-2.25.0.0-b489-linux-x86_64.tar.gz
    dest: /home/packer/
    remote_src: yes
    owner: "packer"
    group: "packer"

- name: Remove tar file 
  ansible.builtin.file:
    path: "/tmp/yugabyte-2.25.0.0-b489-linux-x86_64.tar.gz"
    state: absent

