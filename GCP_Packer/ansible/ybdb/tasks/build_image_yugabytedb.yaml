---
- name: Update the System Package
  ansible.builtin.yum:
    name: "*"
    state: latest
  register: Update_Output

- name: Print the Update_Output
  ansible.builtin.debug:
    msg: "{{ Update_Output }}"

# - name: Check the Which User Packer is creating
#   ansible.builtin.shell: "whoami"
#   register: username

# - name: Print the user name
#   ansible.builtin.debug:
#     msg: "{{ username.stdout }}"

- name: Install Required Package (wget, curl, tar)
  ansible.builtin.yum:
    name: 
      - wget 
      - tar 
      - curl 
    state: present 
    Update_cache: yes
  register: Installation_Output

- name: Print the Above task 
  ansible.builtin.debug: 
    msg: "{{ Installation_Output }}"