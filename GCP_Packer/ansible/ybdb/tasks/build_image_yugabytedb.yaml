---
- name: Update the System Package
  ansible.builtin.yum:
    name: "*"
    state: latest
  register: Update_Output

- name: Print the Update_Output
  ansible.builtin.debug:
    msg: "{{ Update_Output }}"

# - name: Check the Which User Packer is creating
#   ansible.builtin.shell: "whoami"
#   register: username

# - name: Print the user name
#   ansible.builtin.debug:
#     msg: "{{ username.stdout }}"

- name: Install Required Package (wget, curl, tar)
  ansible.builtin.package:
    name: 
      - wget 
      - tar 
      - curl 
    state: present 
  register: Installation_Output

- name: Print the Above task 
  ansible.builtin.debug: 
    msg: "{{ Installation_Output }}"

- name: Download Yugabyte tar file 
  ansible.builtin.get_url: 
    url: wget https://software.yugabyte.com/releases/2.25.1.0/yugabyte-2.25.1.0-b381-linux-x86_64.tar.gz
    dest: /tmp/yugabyte-2.25.1.0-b381-linux-x86_64.tar.gz
  register: downloaded_file 

- name: Print the above task 
  ansible.builtin.debug: 
    msg: "{{ downloaded_file }}"