---
- name: YugabyteDB Installation
  hosts: all
  gather_facts: true
  become: yes
  vars:
    yugabyte_user: packer
    yugabyte_group: packer

  tasks:

    - name: Install wget
      ansible.builtin.yum:
        name: wget
        state: present
      register: install_wget

    - name: print install_wget
      ansible.builtin.debug:
        msg: "{{ install_wget }}"

    - name: Download YugabyteDB tarball
      ansible.builtin.get_url:
        url: "https://software.yugabyte.com/releases/2024.2.2.2/yugabyte-2024.2.2.2-b2-linux-x86_64.tar.gz"
        dest: "/home/packer/yugabyte-2024.2.2.2-b2-linux-x86_64.tar.gz"
        mode: '0644'
      register: ybdb

    - name: Print ybdb 
      ansible.builtin.debug:
        msg: "{{ ybdb }}"
    

    - name: Extract YugabyteDB tarball
      ansible.builtin.unarchive:
        src: "/home/packer/yugabyte-2024.2.2.2-b2-linux-x86_64.tar.gz"
        dest: "/home/packer/"
        remote_src: yes
      register: extract
    
    - name: Extract ybdb 
      ansible.builtin.debug:
        msg: "{{ extract }}"

    - name: Change ownership of entire YugabyteDB directory
      ansible.builtin.file:
        path: "/home/packer/yugabyte-2024.2.2.2"
        owner: packer
        group: packer
        recurse: yes
      register: chown_yugabyte_dir

    - name: Print directory ownership change result
      ansible.builtin.debug:
        msg: "{{ chown_yugabyte_dir }}"


    # - name: Change ownership of openssl-config
    #   ansible.builtin.file:
    #     path: "/home/packer/yugabyte-2024.2.2.2/openssl-config"
    #     owner: packer
    #     group: packer
    #     recurse: yes
    #   register: chagOwner 

    # - name: Print chagOwner 
    #   ansible.builtin.debug:
    #     msg: "{{ chagOwner }}"


    - name: Run post_install.sh
      ansible.builtin.command: ./bin/post_install.sh
      args:
        chdir: "/home/packer/yugabyte-2024.2.2.2"
      register: post_install

    - name: Print the post_install 
      ansible.builtin.debug:
        msg: "{{ post_install }}"
    


    - name: Deploy yugabyte systemd service using template
      ansible.builtin.template:
        src: yugabyte.service.j2
        dest: /etc/systemd/system/yugabyte.service
        owner: root
        group: root
        mode: '0644'
      register: yugaService
    
    - name: Print yugaService  
      ansible.builtin.debug:
        msg: "{{ yugaService }}"

    # - name: Reexec systemd (reload the sysytemd manager configuration)
    #   command: systemctl daemon-reload
    #   register: reexec_print
    
    # - name: Print the reexec_print
    #   ansible.builtin.debug:
    #     msg: "{{ reexec_print }}"

    # - name: Reload systemd to recognize yugabyte service
    #   ansible.builtin.systemd:
    #     daemon_reload: yes
    #   register: Reload
    
    # - name: reload 
    #   ansible.builtin.debug:
    #     msg: "{{ Reload }}"
    

    # - name: Enable yugabyte service on boot
    #   ansible.builtin.systemd:
    #     name: yugabyte.service
    #     enabled: yes
    #   register: enabled
    
    # - name: enabled 
    #   ansible.builtin.debug:
    #     msg: "{{ enabled }}"
    

    # - name: Start yugabyte service
    #   ansible.builtin.systemd:
    #     name: yugabyte
    #     state: started
    #   register: start 
    
    # - name: Pause for few secs 
    #   ansible.builtin.pause:
    #     seconds: 30

    # - name: start  
    #   ansible.builtin.debug:
    #     msg: "{{ start }}"
        

    # - name: Check status of yugabyte service
    #   ansible.builtin.systemd:
    #     name: yugabyte
    #   register: yugabyte_status

    # - name: Show yugabyte service status
    #   ansible.builtin.debug:
    #     msg: "{{ yugabyte_status }}"

    - name: Run systemctl daemon_reexec
      command: systemctl daemon-reexec
      register: daemon_reexec

    - name: daemon-reexec
      ansible.builtin.debug:
        msg: "{{ daemon_reexec }}"

    - name: Reload systemd manager configuration
      command: systemctl daemon-reload
      register: daemon_reload

    - name: daemon-reload
      ansible.builtin.debug:
        msg: "{{ daemon_reload }}"

    - name: Enable yuga.service to start at boot
      systemd:
        name: yugabyte.service
        enabled: yes
      register: enable_service
    
    - name: Enable service
      ansible.builtin.debug:
        msg: "{{ enable_service }}"


    - name: Start yuga.service
      systemd:
        name: yugabyte.service
        state: started
      register: start_service

    - name: start service
      ansible.builtin.debug:
        msg: "{{ start_service }}"
    

    - name: Check status of yuga.service
      command: systemctl status yugabyte.service
      register: service_status
      # ignore_errors: yes

    - name: Display service status output
      debug:
        var: service_status.stdout_lines



